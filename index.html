<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>DICOM Viewer</title>

	<script type="module" defer src="./scripts/rendering/engine.js"></script>

	<link rel="stylesheet" href="./styles/general.css">  
	<link rel="stylesheet" href="./styles/widgets/button.css">
	<link rel="stylesheet" href="./styles/widgets/collapse.css">
	<link rel="stylesheet" href="./styles/widgets/comment.css">
	<link rel="stylesheet" href="./styles/widgets/drag.css">
	<link rel="stylesheet" href="./styles/widgets/increment.css">
	<link rel="stylesheet" href="./styles/widgets/slider.css">
	<link rel="stylesheet" href="./styles/widgets/switch.css">
	<link rel="stylesheet" href="./styles/widgets/toggle.css">
	<link rel="stylesheet" href="./styles/widgets/tooltip.css">
	<link rel="stylesheet" href="./styles/widgets/range.css">
	<link rel="stylesheet" href="./styles/widgets/popup.css">
	<link rel="stylesheet" href="./styles/widgets/curve.css">
	<link rel="stylesheet" href="./styles/widgets/webawesome.css">
	<link rel="stylesheet" href="./styles/widgets/slider_radio.css">
	<link rel="stylesheet" href="./styles/widgets/info.css">
	<link rel="stylesheet" href="./styles/layout.css">
	<link rel="stylesheet" href="./styles/flex.css">
	<link rel="stylesheet" href="./styles/variables.css">

	<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css" />
	<script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
	<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/utilities.css" />
	<link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/native.css" />

	<script src="https://cdn.jsdelivr.net/npm/dicom-parser@1.8.21/dist/dicomParser.min.js"></script>

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
		integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
	<aside>
		<header>
			<div class="row gap-medium align-center justify-space-between padding-medium">
				<h4>DICOM Volume Viewer</h4>
				<div class="row gap-small">
					<samp id="output-fps">0 fps</samp>
					<samp><i class="fa fa-pause" id="time"></i></samp>
				</div>
			</div>
		</header>
		<menu class="column gap-medium padding-medium wide tall" id="menu"></div>
	</aside>
	
	<main class="wide tall">
		<canvas id="canvas"></canvas>
	</main>

	<div class="popup hidden" id="popup">
		<div>
			<header>
				<i class="fa fa-times"></i>		
				<p>ERROR</p>
			</header>
			<samp id="popup-message"></samp>
			<button onclick="location.reload();">
				<i class="fa fa-refresh"></i>
				<p>Restart</p>
			</button>
		</div>
	</div>
</body>

</html>
