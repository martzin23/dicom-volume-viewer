<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Ray Voxel Traversal</title>
	<link rel="stylesheet" href="./styles/widgets.css">
	<link rel="stylesheet" href="./styles/widgets/button.css">
	<link rel="stylesheet" href="./styles/widgets/collapse.css">
	<link rel="stylesheet" href="./styles/widgets/comment.css">
	<link rel="stylesheet" href="./styles/widgets/drag.css">
	<link rel="stylesheet" href="./styles/widgets/increment.css">
	<link rel="stylesheet" href="./styles/widgets/slider.css">
	<link rel="stylesheet" href="./styles/widgets/switch.css">
	<link rel="stylesheet" href="./styles/widgets/toggle.css">
	<link rel="stylesheet" href="./styles/widgets/tooltip.css">
	<link rel="stylesheet" href="./styles/layout.css">
	<link rel="stylesheet" href="./styles/flex.css">
	<link rel="stylesheet" href="./styles/general.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	<script type="module" defer src="./scripts/rendering/engine.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/dicom-parser@1.8.21/dist/dicomParser.min.js"></script>
</head>

<body>

	<menu class="block" id="menu">
		
		<figure id="group-display">
			<figcaption>
				<hr>
				<p>Display</p>
			</figcaption>
			<p class="value" id="output-fps">0 fps</p>
			<input type="file" id="fileInput" webkitdirectory multiple>
		</figure>

		<figure id="group-grid">
			<figcaption>
				<hr>
				<p>Grid</p>
			</figcaption>
		</figure>
	</menu>

	<canvas id="canvas" class="block"></canvas>

	<div class="popup hidden" onclick="this.classList.add('hidden')" id="popup-error">
		<div>
			<div class="row">
				<i class="fa fa-times"></i>		
				<p>Error</p>
			</div>
			<p id="output-fail">This device does not support WebGL!</p>
			<div class="button" onclick="location.reload();">
				<i class="fa fa-refresh"></i>
				<p>Restart</p>
			</div>
		</div>
	</div>
</body>
</html>
